<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YerGez - Mekan Yorumları</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🌍 YerGez</div>
        <div class="search-bar">
            <input type="text" placeholder="Mekan, şehir veya turistik yer ara...">
            <button>Ara</button>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <h1>Keşfet, Puanla, Paylaş!</h1>
            <p>En sevdiğin mekanları değerlendir ve diğer gezginlere ilham ol.</p>
        </div>
    </section>

    <main>
        
        <section class="review-section">
            <h3 style="margin-bottom: 15px; text-align: center;">Yeni Bir Mekan Değerlendir</h3>
            
            <div class="star-rating" id="stars" style="text-align: center;">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>

            <div class="review-form">
                <textarea id="comment-text" placeholder="Gittiğiniz bir mekan hakkında ne düşünüyorsunuz?" rows="4"></textarea>
                <button id="submit-review">Yorumu Gönder</button>
            </div>

            <div class="comments-list" id="comments-list">
                <h3>Eklenen Yorumlar</h3>
                </div>
        </section>

        <hr class="divider">

        <section class="favorites-section">
            <h2>⭐ Popüler Mekanlar ve Yorumlar</h2>
            <div class="places-grid">
                
                <article class="place-card">
                    <img src="https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=500&q=80" alt="Galata Kulesi">
                    <div class="card-content">
                        <h3>Galata Kulesi</h3>
                        <p class="location">İstanbul</p>
                        <div class="star-rating-static">★★★★★</div>
                        <div class="old-comment">
                            <p><strong>
